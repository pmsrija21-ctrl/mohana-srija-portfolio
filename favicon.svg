<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#070b19" stroke="url(#textGrad)" stroke-width="2" />
  <circle cx="50" cy="50" r="38" fill="url(#orbGrad)" opacity="0.5" />
  <ellipse cx="50" cy="50" rx="44" ry="18" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8" transform="rotate(-25 50 50)" />
  <text x="50" y="58" font-family="sans-serif" font-size="24" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2" filter="url(#glow)">MSP</text>
</svg>